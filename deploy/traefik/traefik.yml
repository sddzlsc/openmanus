entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ':443'
    asDefault: true

providers:
  docker:
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  # 泛域名证书：阿里云 DNS（alidns）DNS Challenge。
  # 凭据通过容器环境变量 ALICLOUD_ACCESS_KEY / ALICLOUD_SECRET_KEY 注入（DNS 最小权限）。
  # 注意：Traefik 的静态配置文件不解析 ${VAR}，所以 email 必须由命令行传入：
  #   --certificatesresolvers.alidns.acme.email=you@example.com
  alidns:
    acme:
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: alidns
        resolvers:
          - '223.5.5.5:53'
          - '119.29.29.29:53'

  # 预发布用：先用 staging 验证链路，避免消耗正式额度
  alidns-staging:
    acme:
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      storage: /letsencrypt/acme-staging.json
      dnsChallenge:
        provider: alidns
        resolvers:
          - '223.5.5.5:53'

log:
  level: INFO

accessLog: {}
